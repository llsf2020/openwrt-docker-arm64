name: docker-image

# ImmortalWrt rootfs for an arm64 OpenWrt docker container, pushed to
# ghcr.io. Packages missing from the feeds (docker/sources.txt) are built
# with the SDK, everything is assembled with the ImageBuilder. The versions
# come from versions.env; auto-update.yml builds versions-next.env (a newer
# ImmortalWrt branch) as a test image, tagged test-* and never latest.

# auto-update.yml finds the last build of each versions file by this title
run-name: docker-image (${{ inputs.versions_file || 'versions.env' }})

on:
  workflow_dispatch:
    inputs:
      versions_file:
        type: choice
        options: [versions.env, versions-next.env]
        default: versions.env
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-image.yml"
      - "versions.env"
      - "docker/**"
      - "patches/**"

permissions:
  contents: read

concurrency:
  group: docker-image-${{ inputs.versions_file || 'versions.env' }}
  cancel-in-progress: true

env:
  # RELEASE, DL, SDK, IB_NAME (not IB: make reads that from the environment,
  # and the ImageBuilder recipes break when it is set), AGH_VERSION (the AdGuard
  # Home core shipped with luci-app-adguardhome-classic) and their hashes
  VERSIONS_FILE: ${{ inputs.versions_file || 'versions.env' }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' "$VERSIONS_FILE" | tee -a "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd

      - name: Download SDK
        run: |
          set -euo pipefail
          curl -fsSL -o sdk.tar.zst "${DL}/${SDK}.tar.zst"
          echo "${SDK_SHA256}  sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf sdk.tar.zst
          mv "${SDK}" sdk

      - name: Feeds
        working-directory: sdk
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # the feed copies would be built instead of those from
          # docker/sources.txt: appfilter is unpatched and needs kmod-oaf,
          # mosdns has an init script that conflicts with luci-app-mosdns
          ./scripts/feeds uninstall open-app-filter mosdns
          [ ! -e package/feeds/packages/open-app-filter ]
          [ ! -e package/feeds/packages/mosdns ]

      - name: Fetch sources and apply patches
        run: |
          set -euo pipefail
          [ "$(awk '$1=="oaf"{print $3}' docker/sources.txt)" = "$(cat docker/oaf-netns/UPSTREAM_COMMIT)" ] \
            || { echo "::error::oaf commit differs between docker/sources.txt and docker/oaf-netns/UPSTREAM_COMMIT"; exit 1; }
          grep -vE '^\s*(#|$)' docker/sources.txt | while read -r name url commit dirs; do
            git clone -q "$url" "src/$name"
            git -C "src/$name" checkout -q "$commit"
            [ "$(git -C "src/$name" rev-parse HEAD)" = "$commit" ]
            if [ "$name" = oaf ]; then
              git -C "src/$name" apply --verbose "$GITHUB_WORKSPACE"/docker/oaf-netns/*.patch
            fi
            if [ -d "$GITHUB_WORKSPACE/patches/$name" ]; then
              git -C "src/$name" apply --verbose "$GITHUB_WORKSPACE/patches/$name"/*.patch
            fi
            for d in $dirs; do
              # "." = the package is the whole repository, named after the sources.txt entry
              if [ "$d" = . ]; then t="$name"; else t="$d"; fi
              cp -r "src/$name/$d" "sdk/package/$t"
              rm -rf "sdk/package/$t/.git"
              echo "$t" >> build-list
            done
          done
          grep -q 'af_client' sdk/package/open-app-filter/files/appfilter.init
          if grep -q 'kmod-oaf' sdk/package/luci-app-oaf/Makefile; then
            echo "::error::luci-app-oaf still depends on kmod-oaf"; exit 1
          fi

      - name: Build packages
        working-directory: sdk
        run: |
          set -euo pipefail
          {
            echo "CONFIG_LUCI_LANG_zh_Hans=y"
            echo "CONFIG_SIGNED_PACKAGES=n"
            while read -r d; do
              p="$(sed -n 's/^PKG_NAME:=//p' "package/$d/Makefile")"
              echo "CONFIG_PACKAGE_${p:-$d}=m"
            done < ../build-list
          } >> .config
          make defconfig
          while read -r d; do
            echo "::group::$d"
            make "package/$d/compile" -j"$(nproc)" V=s 2>&1 | tail -n 200
            echo "::endgroup::"
          done < ../build-list
          mkdir -p ../apks
          find bin/packages -path '*/base/*.apk' -exec cp {} ../apks/ \;
          ls -l ../apks
          test -n "$(ls ../apks/appfilter-*.apk)"
          test -n "$(ls ../apks/luci-app-oaf-*.apk)"
          test -n "$(ls ../apks/mosdns-*.apk)"
          test -n "$(ls ../apks/luci-app-adguardhome-classic-*.apk)"
          if ls bin/packages/*/packages/appfilter-*.apk bin/packages/*/packages/mosdns-*.apk 2>/dev/null; then
            echo "::error::appfilter or mosdns was built from the feed"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: apks/
          retention-days: 7

  image:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' "$VERSIONS_FILE" | tee -a "$GITHUB_ENV"

      - name: Download ImageBuilder
        run: |
          set -euo pipefail
          curl -fsSL -o ib.tar.zst "${DL}/${IB_NAME}.tar.zst"
          echo "${IB_SHA256}  ib.tar.zst" | sha256sum -c -
          tar --zstd -xf ib.tar.zst
          mv "${IB_NAME}" ib
          # only the rootfs tarball is needed
          sed -i -E 's/^(CONFIG_TARGET_ROOTFS_(EXT4FS|SQUASHFS|CPIOGZ|ISO)|CONFIG_GRUB_EFI_IMAGES|CONFIG_EFI_IMAGES)=y/# \1 is not set/' ib/.config
          grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y' ib/.config || echo 'CONFIG_TARGET_ROOTFS_TARGZ=y' >> ib/.config

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: ib/packages/

      - name: Add the AdGuard Home core
        run: |
          set -euo pipefail
          # luci-app-adguardhome-classic only ships the LuCI app; put the
          # official core where it expects it, so it does not download it on first start
          curl -fsSL -o agh.tar.gz "https://github.com/AdguardTeam/AdGuardHome/releases/download/${AGH_VERSION}/AdGuardHome_linux_arm64.tar.gz"
          echo "${AGH_SHA256}  agh.tar.gz" | sha256sum -c -
          tar -xzf agh.tar.gz
          install -Dm755 AdGuardHome/AdGuardHome "$GITHUB_WORKSPACE/docker/files/usr/bin/AdGuardHome/AdGuardHome"
          rm -rf agh.tar.gz AdGuardHome

      - name: Build rootfs
        working-directory: ib
        run: |
          set -euo pipefail
          pkgs="$(grep -vE '^\s*(#|$)' ../docker/packages.txt | tr '\n' ' ')"
          # translations of the locally built apps
          for f in packages/luci-i18n-*-zh-cn-*.apk; do
            [ -e "$f" ] || continue
            pkgs="$pkgs $(basename "$f" | sed -E 's/^(luci-i18n-.*-zh-cn)-[0-9].*/\1/')"
          done
          echo "packages: $pkgs"
          make image PROFILE=generic PACKAGES="$pkgs" FILES="$GITHUB_WORKSPACE/docker/files" 2>&1 | tee ../ib.log
          ls -l bin/targets/armsr/armv8/
          rootfs="$(find bin/targets/armsr/armv8 -maxdepth 1 -name "*rootfs.tar.gz" | head -n1)"
          test -s "$rootfs"
          sudo ../docker/prepare-rootfs.sh "$rootfs" ../docker/rootfs.tar.gz
          sudo chown "$(id -u):$(id -g)" ../docker/rootfs.tar.gz
          # installed package list, for the summary and the release notes
          tar -xzOf ../docker/rootfs.tar.gz ./lib/apk/db/installed | sed -n 's/^P://p' | sort > ../installed.txt
          for p in $pkgs; do grep -qx "$p" ../installed.txt || { echo "::error::$p not installed"; exit 1; }; done
          {
            echo "### ImmortalWrt ${RELEASE} rootfs"
            echo "- rootfs: $(du -h ../docker/rootfs.tar.gz | cut -f1)"
            echo "- packages installed: $(wc -l < ../installed.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          tag="${RELEASE}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          if [ "$VERSIONS_FILE" = versions.env ]; then
            tags=(-t "${image}:${tag}" -t "${image}:${RELEASE}" -t "${image}:latest")
          else
            tag="test-${tag}"
            tags=(-t "${image}:${tag}")
          fi
          docker buildx build docker/ \
            --platform linux/arm64 \
            --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${tag}" \
            "${tags[@]}" \
            --push
          echo "- image: \`${image}:${tag}\` (${VERSIONS_FILE})" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove old images
        if: github.ref == 'refs/heads/main'
        # needs the Admin role for this repository in the package settings
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 6
        run: |
          set -euo pipefail
          pkg="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          api="users/${GITHUB_REPOSITORY_OWNER}/packages/container/${pkg}/versions"
          # newest first; keep the newest KEEP tagged versions and anything tagged
          # latest or with a release tag, delete the rest (older and untagged)
          gh api --paginate "$api" --jq '.[] | [.id, ((.metadata.container.tags // []) | join(","))] | @tsv' > versions.tsv
          kept=0
          while IFS=$'\t' read -r id tags; do
            if [[ ",$tags," =~ ,(latest|[0-9]+\.[0-9]+\.[0-9]+), ]]; then continue; fi
            if [ -n "$tags" ] && [ "$kept" -lt "$KEEP" ]; then kept=$((kept + 1)); continue; fi
            echo "delete $id ${tags:-<untagged>}"
            gh api -X DELETE "$api/$id" --silent
          done < versions.tsv

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-logs
          path: |
            ib.log
            installed.txt
          if-no-files-found: ignore
          retention-days: 7
