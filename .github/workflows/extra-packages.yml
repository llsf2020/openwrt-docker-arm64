name: extra-packages

# Builds only the packages in packages/ (each folder with a Makefile) and those
# listed in packages/sources.txt, as ipk for 24.10 and apk for 25.12, and
# publishes them as a release. The images are not rebuilt.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extra-packages.yml"
      - "packages/**"

permissions:
  contents: read

concurrency:
  group: extra-packages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "24.10.6"
            sdk: immortalwrt-sdk-24.10.6-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64
            sha256: f6571ad60a9e681dcab6934a8874c5b57f1c5dd51305ac28127c1e4ed0d766c3
          - release: "25.12.2"
            sdk: immortalwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64
            sha256: 8e2891ff99f12d1a9b7164c62064c3d47a1e766e04c3ad3f9f3d0189731f8c7d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd

      - name: Download SDK
        run: |
          set -euo pipefail
          curl -fsSL -o sdk.tar.zst "https://downloads.immortalwrt.org/releases/${{ matrix.release }}/targets/armsr/armv8/${{ matrix.sdk }}.tar.zst"
          echo "${{ matrix.sha256 }}  sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf sdk.tar.zst
          mv "${{ matrix.sdk }}" sdk

      - name: Feeds
        working-directory: sdk
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build
        working-directory: sdk
        run: |
          set -euo pipefail
          : > ../build-list
          # packages kept in this repository
          for d in ../packages/*/; do
            [ -f "$d/Makefile" ] || continue
            cp -r "$d" package/
            basename "$d" >> ../build-list
          done
          # third-party packages at pinned commits
          grep -vE '^\s*(#|$)' ../packages/sources.txt | while read -r name url commit dirs; do
            git clone -q "$url" "../src/$name"
            git -C "../src/$name" checkout -q "$commit"
            [ "$(git -C "../src/$name" rev-parse HEAD)" = "$commit" ]
            for d in $dirs; do
              cp -r "../src/$name/$d" "package/$d"
              echo "$d" >> ../build-list
            done
          done
          cat ../build-list
          {
            echo "CONFIG_LUCI_LANG_zh_Hans=y"
            echo "CONFIG_SIGNED_PACKAGES=n"
            while read -r d; do
              p="$(sed -n 's/^PKG_NAME:=//p' "package/$d/Makefile")"
              echo "CONFIG_PACKAGE_${p:-$d}=m"
            done < ../build-list
          } >> .config
          make defconfig
          while read -r d; do
            echo "::group::$d"
            make "package/$d/compile" -j"$(nproc)" V=s 2>&1 | tail -n 100
            echo "::endgroup::"
          done < ../build-list
          # only the packages listed above and their translations: dependencies
          # built along the way end up in the same folder
          mkdir -p ../out
          while read -r d; do
            p="$(sed -n "s/^PKG_NAME:=//p" "package/$d/Makefile")"
            p="${p:-$d}"
            find bin/packages -path "*/base/*" -type f -name "${p}[-_][0-9]*" \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} ../out/ \;
            case "$p" in
              luci-app-*)
                i="luci-i18n-${p#luci-app-}-zh-cn"
                find bin/packages -path "*/base/*" -type f -name "${i}[-_]*" \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} ../out/ \;
                ;;
            esac
            ls ../out/"$p"[-_]* >/dev/null || { echo "::error::$p was not built"; exit 1; }
          done < ../build-list
          ls -l ../out
          [ "$(ls ../out | wc -l)" -le 40 ] || { echo "::error::too many files collected"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extra-${{ matrix.release }}
          path: out/
          retention-days: 7

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: extra-*
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="packages-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          mkdir -p release
          for d in dist/extra-*; do
            rel="${d#dist/extra-}"
            for f in "$d"/*; do cp "$f" "release/${rel}_$(basename "$f")"; done
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "$tag" \
            --notes "Packages from packages/ for aarch64. Files starting with 24.10.6_ are ipk for ImmortalWrt/OpenWrt 24.10 (opkg), 25.12.2_ are apk for 25.12."
