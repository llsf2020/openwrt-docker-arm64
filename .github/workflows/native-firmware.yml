name: native-firmware

# ImmortalWrt firmware for the Phicomm N1, installed directly on the box.
# Packages missing from the feeds (native/sources.txt) are built with the SDK,
# oaf.ko is built against the pinned kernel, the ImageBuilder assembles the
# rootfs and ophub's packager turns it into a bootable image.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-firmware.yml"
      - "native/**"

permissions:
  contents: read

concurrency:
  group: native-firmware
  cancel-in-progress: true

env:
  RELEASE: "25.12.2"
  DL: https://downloads.immortalwrt.org/releases/25.12.2/targets/armsr/armv8
  SDK: immortalwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64
  SDK_SHA256: 8e2891ff99f12d1a9b7164c62064c3d47a1e766e04c3ad3f9f3d0189731f8c7d
  # not IB: make reads that from the environment, and the ImageBuilder
  # recipes break when it is set
  IB_NAME: immortalwrt-imagebuilder-25.12.2-armsr-armv8.Linux-x86_64
  IB_SHA256: a8c1ffda15e7d79854ff4afd711da3e7224e84945c79f03d80fc6cf48727cb9c
  # ophub/kernel keeps only recent versions: when this one disappears, update
  # the version and the hash together
  KERNEL_REPO: ophub/kernel
  KERNEL_TAG: kernel_stable
  KERNEL_VERSION: "6.12.115"
  KERNEL_LOCALVERSION: "-ophub"
  KERNEL_SHA256: 35367bd5f1fcc4bd15f85637da0060dd5827588bc8f8d6070d21dcea3143c190
  # must be the compiler the kernel was built with (CONFIG_CC_VERSION_TEXT is checked)
  TOOLCHAIN_TAG: toolchain
  TOOLCHAIN: arm-gnu-toolchain-15.3.rel1-aarch64-aarch64-none-linux-gnu
  TOOLCHAIN_SHA256: 8020be7aa1013704756158400cb5ba438d6f09b2909795d13617b9e7bac53286

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd

      - name: Download SDK
        run: |
          set -euo pipefail
          curl -fsSL -o sdk.tar.zst "${DL}/${SDK}.tar.zst"
          echo "${SDK_SHA256}  sdk.tar.zst" | sha256sum -c -
          tar --zstd -xf sdk.tar.zst
          mv "${SDK}" sdk

      - name: Feeds
        working-directory: sdk
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # the feed copies would be built instead of those from
          # native/sources.txt: appfilter needs kmod-oaf, mosdns has an init
          # script that conflicts with luci-app-mosdns
          ./scripts/feeds uninstall open-app-filter mosdns
          [ ! -e package/feeds/packages/open-app-filter ]
          [ ! -e package/feeds/packages/mosdns ]

      - name: Fetch sources and apply patches
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' native/sources.txt | while read -r name url commit dirs; do
            git clone -q "$url" "src/$name"
            git -C "src/$name" checkout -q "$commit"
            [ "$(git -C "src/$name" rev-parse HEAD)" = "$commit" ]
            if [ "$name" = oaf ]; then
              git -C "src/$name" apply --verbose "$GITHUB_WORKSPACE"/native/patches/*.patch
            fi
            for d in $dirs; do
              cp -r "src/$name/$d" "sdk/package/$d"
              echo "$d" >> build-list
            done
          done
          if grep -q 'kmod-oaf' sdk/package/luci-app-oaf/Makefile; then
            echo "::error::luci-app-oaf still depends on kmod-oaf"; exit 1
          fi

      - name: Build packages
        working-directory: sdk
        run: |
          set -euo pipefail
          {
            echo "CONFIG_LUCI_LANG_zh_Hans=y"
            echo "CONFIG_SIGNED_PACKAGES=n"
            # the other proxy programs come prebuilt from the feeds
            echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Libev_Client=y"
            while read -r d; do
              p="$(sed -n 's/^PKG_NAME:=//p' "package/$d/Makefile")"
              echo "CONFIG_PACKAGE_${p:-$d}=m"
            done < ../build-list
          } >> .config
          make defconfig
          while read -r d; do
            echo "::group::$d"
            make "package/$d/compile" -j"$(nproc)" V=s 2>&1 | tail -n 200
            echo "::endgroup::"
          done < ../build-list
          mkdir -p ../apks
          find bin/packages -path '*/base/*.apk' -exec cp {} ../apks/ \;
          ls -l ../apks
          test -n "$(ls ../apks/appfilter-*.apk)"
          test -n "$(ls ../apks/luci-app-oaf-*.apk)"
          test -n "$(ls ../apks/mosdns-*.apk)"
          test -n "$(ls ../apks/luci-app-ssr-plus-*.apk)"
          test -n "$(ls ../apks/shadowsocksr-libev-ssr-local-*.apk)"
          if ls bin/packages/*/packages/appfilter-*.apk bin/packages/*/packages/mosdns-*.apk 2>/dev/null; then
            echo "::error::appfilter or mosdns was built from the feed"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-apks
          path: apks/
          retention-days: 7

  oaf:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download kernel headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="${KERNEL_VERSION}${KERNEL_LOCALVERSION}"
          mkdir -p dl && cd dl
          gh release download "$KERNEL_TAG" -R "$KERNEL_REPO" -p "${KERNEL_VERSION}.tar.gz"
          echo "${KERNEL_SHA256}  ${KERNEL_VERSION}.tar.gz" | sha256sum -c -
          tar -xzf "${KERNEL_VERSION}.tar.gz"
          cd "${KERNEL_VERSION}"
          grep "header-${release}.tar.gz" sha256sums | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/headers"
          tar -xzf "header-${release}.tar.gz" -C "$GITHUB_WORKSPACE/headers"
          grep -q "\"${release}\"" "$GITHUB_WORKSPACE/headers/include/generated/utsrelease.h"

      - name: Download toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dl
          gh release download "$TOOLCHAIN_TAG" -R "$KERNEL_REPO" -p "${TOOLCHAIN}.tar.xz"
          echo "${TOOLCHAIN_SHA256}  ${TOOLCHAIN}.tar.xz" | sha256sum -c -
          tar -xJf "${TOOLCHAIN}.tar.xz" -C "$GITHUB_WORKSPACE"
          want="$(sed -n 's/^CONFIG_CC_VERSION_TEXT=//p' "$GITHUB_WORKSPACE/headers/include/config/auto.conf" | tr -d '"')"
          have="$("$GITHUB_WORKSPACE/${TOOLCHAIN}/bin/aarch64-none-linux-gnu-gcc" --version | head -n1)"
          echo "kernel built with: $want"
          echo "toolchain:         $have"
          [ "$want" = "$have" ] || { echo "::error::toolchain does not match the kernel compiler"; exit 1; }

      - name: Build oaf.ko
        run: |
          set -euo pipefail
          read -r _ url commit _ < <(grep -E '^oaf\s' native/sources.txt)
          git clone -q "$url" oaf-src
          git -C oaf-src checkout -q "$commit"
          [ "$(git -C oaf-src rev-parse HEAD)" = "$commit" ]
          # same relaxed warnings as upstream oaf/Makefile
          KCFLAGS="-Wno-error=missing-prototypes -Wno-error=strict-prototypes \
            -Wno-error=missing-declarations -Wno-error=unused-variable \
            -Wno-error=declaration-after-statement -Wno-error=implicit-fallthrough \
            -Wno-error=missing-braces -Wno-error=parentheses -Wno-error=format \
            -Wno-frame-larger-than"
          make -C "$GITHUB_WORKSPACE/headers" \
            ARCH=arm64 \
            CROSS_COMPILE="$GITHUB_WORKSPACE/${TOOLCHAIN}/bin/aarch64-none-linux-gnu-" \
            M="$GITHUB_WORKSPACE/oaf-src/oaf/src" \
            KCFLAGS="$KCFLAGS" \
            modules > build.log 2>&1 || { tail -n 50 build.log; exit 1; }
          ko=oaf-src/oaf/src/oaf.ko
          test -s "$ko"
          modinfo "$ko" | tee modinfo.txt
          grep -q "^vermagic: *${KERNEL_VERSION}${KERNEL_LOCALVERSION} " modinfo.txt || { echo "::error::vermagic mismatch"; exit 1; }
          mkdir -p out
          cp "$ko" modinfo.txt build.log out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-oaf
          path: out/
          retention-days: 7

  firmware:
    needs: [packages, oaf]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the runner
        run: |
          set -euo pipefail
          # the image and the unpacked rootfs need room
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs dosfstools e2fsprogs parted pigz uuid-runtime zstd
          df -h /

      - name: Download ImageBuilder
        run: |
          set -euo pipefail
          curl -fsSL -o ib.tar.zst "${DL}/${IB_NAME}.tar.zst"
          echo "${IB_SHA256}  ib.tar.zst" | sha256sum -c -
          tar --zstd -xf ib.tar.zst
          rm ib.tar.zst
          mv "${IB_NAME}" ib
          # only the rootfs tarball is needed
          sed -i -E 's/^(CONFIG_TARGET_ROOTFS_(EXT4FS|SQUASHFS|CPIOGZ|ISO)|CONFIG_GRUB_EFI_IMAGES|CONFIG_EFI_IMAGES)=y/# \1 is not set/' ib/.config
          grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y' ib/.config || echo 'CONFIG_TARGET_ROOTFS_TARGZ=y' >> ib/.config

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-apks
          path: ib/packages/

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-oaf
          path: oaf/

      - name: Build rootfs
        working-directory: ib
        run: |
          set -euo pipefail
          pkgs="$(grep -vE '^\s*(#|$)' ../native/packages.txt | tr '\n' ' ')"
          # translations of the locally built apps
          for f in packages/luci-i18n-*-zh-cn-*.apk; do
            [ -e "$f" ] || continue
            pkgs="$pkgs $(basename "$f" | sed -E 's/^(luci-i18n-.*-zh-cn)-[0-9].*/\1/')"
          done
          echo "packages: $pkgs"
          make image PROFILE=generic PACKAGES="$pkgs" FILES="$GITHUB_WORKSPACE/native/files" 2>&1 | tee ../ib.log
          rootfs="$(find bin/targets/armsr/armv8 -maxdepth 1 -name "*rootfs.tar.gz" | head -n1)"
          test -s "$rootfs"
          mkdir -p ../rootfs
          mv "$rootfs" ../rootfs/
          tar -xzOf ../rootfs/*rootfs.tar.gz ./lib/apk/db/installed | sed -n 's/^P://p' | sort > ../installed.txt
          for p in $pkgs; do grep -qx "$p" ../installed.txt || { echo "::error::$p not installed"; exit 1; }; done
          cd .. && rm -rf ib

      - name: Add oaf.ko to the packager's files
        run: |
          set -euo pipefail
          # the packager replaces /lib/modules with the modules of the kernel
          # it installs, keeps this file and links it into the module directory; it
          # fails if the module directory has any subdirectory other than kernel/
          install -Dm644 oaf/oaf.ko "extra-files/lib/modules/${KERNEL_VERSION}${KERNEL_LOCALVERSION}/kernel/extra/oaf.ko"

      - name: Package firmware
        uses: ophub/amlogic-s9xxx-openwrt@a4a9d879a68a76580027c54d9459a5c382491a54 # main, 2026-11-02
        with:
          openwrt_path: rootfs/*rootfs.tar.gz
          openwrt_board: s905d
          openwrt_kernel: ${{ env.KERNEL_VERSION }}
          kernel_usage: stable
          auto_kernel: false
          openwrt_size: 512/3072
          openwrt_files: extra-files

      - name: Check the image
        run: |
          set -euo pipefail
          [ "${PACKAGED_STATUS:-}" = success ]
          ls -lh "$PACKAGED_OUTPUTPATH"
          img_gz="$(find "$PACKAGED_OUTPUTPATH" -maxdepth 1 -name '*.img.gz' | head -n1)"
          test -s "$img_gz"
          [ "$(find "$PACKAGED_OUTPUTPATH" -maxdepth 1 -name '*.img.gz' | wc -l)" -eq 1 ]
          case "$img_gz" in *s905d*"k${KERNEL_VERSION}"*) ;; *) echo "::error::unexpected image $img_gz"; exit 1 ;; esac
          [ "$(stat -c %s "$img_gz")" -lt 2000000000 ] || { echo "::error::image too large for a release asset"; exit 1; }
          sudo sh -c "gzip -dc '$img_gz' > check.img"
          loop="$(sudo losetup -Pf --show check.img)"
          sudo partprobe "$loop" || true
          mkdir -p root
          sudo mount -o ro "${loop}p2" root
          m="root/lib/modules/${KERNEL_VERSION}${KERNEL_LOCALVERSION}"
          for f in "$m/kernel/extra/oaf.ko" "$m/oaf.ko" "$m/tun.ko" "$m/nft_tproxy.ko" "$m/nft_socket.ko" \
                   root/etc/modules.d/99-oaf root/etc/uci-defaults/90-native root/usr/sbin/openwrt-install-amlogic; do
            sudo test -e "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          for d in $(sed -n 's/^depends: *//p' oaf/modinfo.txt | tr ',' ' '); do
            sudo test -e "$m/$d.ko" || { echo "::error::oaf.ko needs $d, not in the kernel modules"; exit 1; }
          done
          used="$(sudo df -h --output=used,size root | tail -n1)"
          sudo umount root
          sudo losetup -d "$loop"
          sudo rm -f check.img
          {
            echo "### ImmortalWrt ${RELEASE} for N1"
            echo "- kernel: ${KERNEL_VERSION}${KERNEL_LOCALVERSION}"
            echo "- image: $(du -h "$img_gz" | cut -f1)"
            echo "- rootfs used/size: ${used}"
            echo "- packages installed: $(wc -l < installed.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "IMG_GZ=$img_gz" >> "$GITHUB_ENV"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="native-${RELEASE}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          mkdir -p release
          name="immortalwrt-${RELEASE}-phicomm-n1-k${KERNEL_VERSION}.img.gz"
          sudo cp "$IMG_GZ" "release/$name"
          sudo chown "$(id -u):$(id -g)" "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "$tag" \
            --notes "ImmortalWrt ${RELEASE} for the Phicomm N1, kernel ${KERNEL_VERSION}${KERNEL_LOCALVERSION}. See native/README.md."
          echo "- release: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-firmware-logs
          path: |
            ib.log
            installed.txt
            oaf/modinfo.txt
          if-no-files-found: ignore
          retention-days: 7
